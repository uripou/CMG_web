<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Instagram Post – Centre Medic Granollers</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700;800&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: #e0e0e0;
      font-family: 'Montserrat', sans-serif;
    }

    .post {
      width: 1080px;
      height: 1080px;
      background: #ffffff;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Background decorative shapes */
    .bg-circle-1 {
      position: absolute;
      width: 700px;
      height: 700px;
      border-radius: 50%;
      background: #e8f9f8;
      top: -250px;
      right: -200px;
      z-index: 0;
    }
    .bg-circle-2 {
      position: absolute;
      width: 300px;
      height: 300px;
      border-radius: 50%;
      background: #d0f4f2;
      bottom: 60px;
      left: -80px;
      z-index: 0;
    }
    .bg-arc {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 220px;
      background: #0ABAB5;
      border-radius: 60% 60% 0 0 / 40% 40% 0 0;
      z-index: 0;
    }

    /* Header */
    .header {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      gap: 18px;
      margin-top: 54px;
    }

    /* Logo */
    .logo-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .logo-svg {
      width: 72px;
      height: 72px;
      filter: drop-shadow(0 4px 12px rgba(10,186,181,0.25));
    }

    .brand-text {
      display: flex;
      flex-direction: column;
      line-height: 1.15;
    }
    .brand-main {
      font-size: 28px;
      font-weight: 800;
      color: #0ABAB5;
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    .brand-sub {
      font-size: 16px;
      font-weight: 400;
      color: #5a5a5a;
      letter-spacing: 4px;
      text-transform: uppercase;
    }

    /* Tagline */
    .tagline {
      position: relative;
      z-index: 1;
      margin-top: 38px;
      text-align: center;
    }
    .tagline h1 {
      font-size: 40px;
      font-weight: 800;
      color: #1a1a2e;
      line-height: 1.2;
    }
    .tagline h1 span {
      color: #0ABAB5;
    }
    .tagline p {
      margin-top: 12px;
      font-size: 17px;
      font-weight: 300;
      color: #555;
      letter-spacing: 0.5px;
    }

    /* Divider */
    .divider {
      position: relative;
      z-index: 1;
      width: 60px;
      height: 4px;
      background: #0ABAB5;
      border-radius: 2px;
      margin: 22px auto 0;
    }

    /* Specialties grid */
    .grid {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 18px;
      margin-top: 40px;
      padding: 0 56px;
      width: 100%;
    }

    .card {
      background: #ffffff;
      border-radius: 20px;
      padding: 22px 10px 18px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      box-shadow: 0 6px 28px rgba(10,186,181,0.13);
      border: 1.5px solid #e4f8f7;
      transition: transform 0.2s;
    }

    .card-icon {
      width: 52px;
      height: 52px;
      background: linear-gradient(135deg, #0ABAB5 0%, #07918d 100%);
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card-icon svg {
      width: 28px;
      height: 28px;
      fill: white;
    }
    .card-label {
      font-size: 13.5px;
      font-weight: 600;
      color: #2a2a2a;
      text-align: center;
      line-height: 1.3;
    }

    /* Footer */
    .footer {
      position: relative;
      z-index: 1;
      margin-top: auto;
      margin-bottom: 46px;
      text-align: center;
    }
    .footer p {
      font-size: 15px;
      font-weight: 600;
      color: #ffffff;
      letter-spacing: 1px;
    }
    .footer .website {
      font-size: 13px;
      font-weight: 300;
      color: rgba(255,255,255,0.85);
      margin-top: 4px;
      letter-spacing: 2px;
    }
  </style>
</head>
<body>
<div class="post">

  <!-- Background -->
  <div class="bg-circle-1"></div>
  <div class="bg-circle-2"></div>
  <div class="bg-arc"></div>

  <!-- Header with logo -->
  <div class="header">
    <div class="logo-wrap">
      <!-- Invented logo: stylized cross inside a rounded shield with "CMG" initials -->
      <svg class="logo-svg" viewBox="0 0 72 72" fill="none" xmlns="http://www.w3.org/2000/svg">
        <!-- Shield shape -->
        <path d="M36 4 L62 16 L62 40 C62 54 50 64 36 68 C22 64 10 54 10 40 L10 16 Z"
              fill="#0ABAB5"/>
        <!-- White cross -->
        <rect x="31" y="18" width="10" height="34" rx="3" fill="white"/>
        <rect x="19" y="30" width="34" height="10" rx="3" fill="white"/>
        <!-- Small teal dot center for style -->
        <circle cx="36" cy="35" r="4" fill="#0ABAB5"/>
      </svg>
    </div>
    <div class="brand-text">
      <span class="brand-main">Centre Mèdic</span>
      <span class="brand-sub">Granollers</span>
    </div>
  </div>

  <!-- Tagline -->
  <div class="tagline">
    <h1>Un equip <span>multidisciplinari</span><br>al teu servei</h1>
    <p>Totes les especialitats en un sol centre</p>
  </div>
  <div class="divider"></div>

  <!-- Specialties -->
  <div class="grid">

    <!-- Dermatologia -->
    <div class="card">
      <div class="card-icon">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z"/>
        </svg>
      </div>
      <span class="card-label">Dermatologia</span>
    </div>

    <!-- Traumatologia -->
    <div class="card">
      <div class="card-icon">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M10.5 2.5C10.5 1.67 11.17 1 12 1s1.5.67 1.5 1.5v4.79l4.15 2.4c.51.3.68.95.38 1.46L15.5 14.5H8.5l-2.53-4.35c-.3-.51-.13-1.16.38-1.46l4.15-2.4V2.5zM8 16h8v1.5c0 2.49-2.01 4.5-4.5 4.5S7 19.99 7 17.5V16h1z"/>
        </svg>
      </div>
      <span class="card-label">Traumatologia</span>
    </div>

    <!-- Ginecologia -->
    <div class="card">
      <div class="card-icon">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 2a5 5 0 1 0 0 10A5 5 0 0 0 12 2zm0 12c-3.5 0-7 1.57-7 3.5V20h14v-2.5c0-1.93-3.5-3.5-7-3.5z"/>
        </svg>
      </div>
      <span class="card-label">Ginecologia</span>
    </div>

    <!-- Cardiologia -->
    <div class="card">
      <div class="card-icon">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
        </svg>
      </div>
      <span class="card-label">Cardiologia</span>
    </div>

    <!-- Pediatria -->
    <div class="card">
      <div class="card-icon">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M13 2.05V4.07c3.39.49 6 3.39 6 6.93 0 3.21-1.82 6-4.72 7.28L13 17v-2l1.5-.67C16.32 13.5 17 11.83 17 11c0-2.76-2.24-5-5-5S7 8.24 7 11c0 .83.68 2.5 2.5 3.33L11 15v2l-1.28.28C6.82 16 5 13.21 5 10c0-3.54 2.61-6.44 6-6.93V1.05C5.17 1.56 1 5.77 1 10.9 1 16.5 5.5 21 11.1 21H13v1h2v-3h-2v1h-1.1C6.61 19 3 15.39 3 10.9 3 6.59 6.29 3.06 10.5 2.1L13 2.05z"/>
        </svg>
      </div>
      <span class="card-label">Pediatria</span>
    </div>

    <!-- Oftalmologia -->
    <div class="card">
      <div class="card-icon">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>
        </svg>
      </div>
      <span class="card-label">Oftalmologia</span>
    </div>

    <!-- Odontologia -->
    <div class="card">
      <div class="card-icon">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 1C9 1 6 3 6 6c0 2.08.62 3.5 1.25 4.87C8.09 12.6 8.5 14.5 8.5 17.5c0 1.93.57 3.5 1.75 3.5.93 0 1.5-.96 1.75-2.5.25-1.5.5-2.5 1-2.5s.75 1 1 2.5c.25 1.54.82 2.5 1.75 2.5 1.18 0 1.75-1.57 1.75-3.5 0-3-.41-4.9-1.25-6.63C15.38 9.5 16 8.08 16 6c0-3-2-5-4-5z"/>
        </svg>
      </div>
      <span class="card-label">Odontologia</span>
    </div>

    <!-- Psicologia -->
    <div class="card">
      <div class="card-icon">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M11.5 2C6.81 2 3 5.81 3 10.5S6.81 19 11.5 19h.5v3c4.86-2.34 8-7 8-11.5C20 5.81 16.19 2 11.5 2zm1 14.5h-2v-2h2v2zm0-4h-2c0-3.25 3-3 3-5 0-1.1-.9-2-2-2s-2 .9-2 2h-2c0-2.21 1.79-4 4-4s4 1.79 4 4c0 2.5-3 2.75-3 5z"/>
        </svg>
      </div>
      <span class="card-label">Psicologia</span>
    </div>

  </div>

  <!-- Footer -->
  <div class="footer">
    <p>centremedicgranollers.cat</p>
    <p class="website">@centremedicgranollers</p>
  </div>

</div>
</body>
</html>
